name: nldmap-v2

x-server-environment: &server-environment
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_HTTP_PORTS: "8080"
  ASPNETCORE_HTTPS_PORT: "443"
  AllowedHosts: ${SITE_DOMAIN:?Configura SITE_DOMAIN}
  PublicAppUrl: https://${SITE_DOMAIN}
  ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=nldmap;Username=nldmap_app;Password=${POSTGRES_APP_PASSWORD:?Configura POSTGRES_APP_PASSWORD}
  MongoDb__ConnectionString: mongodb://nldmap_app:${MONGO_APP_PASSWORD:?Configura MONGO_APP_PASSWORD}@mongodb:27017/nldmap?authSource=nldmap
  MongoDb__Database: nldmap
  DataProtection__KeysPath: /var/lib/nldmap/keys
  ReverseProxy__KnownProxy: 172.29.240.2
  Email__Mode: Smtp
  Email__Host: ${EMAIL_HOST:-}
  Email__Port: ${EMAIL_PORT:-587}
  Email__From: ${EMAIL_FROM:-}
  Email__Username: ${EMAIL_USERNAME:-}
  Email__Password: ${EMAIL_PASSWORD:-}

services:
  server:
    image: ${SERVER_IMAGE:-ghcr.io/jimmyvazquez-stack/nldmap-server}:${IMAGE_TAG:?Configura IMAGE_TAG}
    restart: unless-stopped
    environment: *server-environment
    volumes:
      - keys:/var/lib/nldmap/keys
    networks: [proxy, data]
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, -H, "Host: ${SITE_DOMAIN}", -H, "X-Forwarded-Proto: https", http://127.0.0.1:8080/health/live]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  init:
    image: ${SERVER_IMAGE:-ghcr.io/jimmyvazquez-stack/nldmap-server}:${IMAGE_TAG:?Configura IMAGE_TAG}
    profiles: [init]
    environment:
      <<: *server-environment
      MigrateDatabase: "true"
      SeedRoles: "true"
    volumes:
      - keys:/var/lib/nldmap/keys
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      proxy:
        ipv4_address: 172.29.240.2
    depends_on:
      server:
        condition: service_healthy

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Configura POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      POSTGRES_APP_USER: nldmap_app
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      POSTGRES_APP_DB: nldmap
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres:/docker-entrypoint-initdb.d:ro
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongodb:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Configura MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: nldmap
      MONGO_APP_USER: nldmap_app
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    volumes:
      - mongo_data:/data/db
      - ./deploy/mongo:/docker-entrypoint-initdb.d:ro
    networks: [data]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

networks:
  proxy:
    ipam:
      config:
        - subnet: 172.29.240.0/24
  data:
    internal: true

volumes:
  postgres_data:
  mongo_data:
  keys:
  caddy_data:
  caddy_config:
