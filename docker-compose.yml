services:

  dev:
    build:
      context: .
      dockerfile: docker/dev/Dockerfile

    container_name: nldmap-dev

    working_dir: /workspace

    volumes:
      - .:/workspace

    ports:
      - "8080:8080"

    stdin_open: true
    tty: true

    command: sleep infinity

    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      neo4j-init:
        condition: service_completed_successfully
    networks:
      - nldmap-network

  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    env_file:
      - .env.postgresql
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nldmap_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nldmap-network

  mongo:
    build:
      context: ./docker/mongo
      dockerfile: Dockerfile
    env_file:
      - .env.mongo
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - nldmap_mongo_data:/data/db
    healthcheck:
       test: ["CMD-SHELL", "mongosh --quiet --host 127.0.0.1 --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'if (db.adminCommand({ ping: 1 }).ok !== 1) quit(1)'"]
       interval: 10s
       timeout: 5s
       retries: 10
    networks:
        - nldmap-network

  neo4j:
    build:
      context: ./docker/neo4j
      dockerfile: Dockerfile
    env_file:
     - .env.neo4j
    ports:
     - "127.0.0.1:7474:7474"
     - "127.0.0.1:7687:7687"
    volumes:
     - nldmap_neo4j_data:/data
    healthcheck:
     test: ["CMD-SHELL", "bash -c ':</dev/tcp/127.0.0.1/7687'"]
     interval: 15s
     timeout: 5s
     retries: 12
     start_period: 30s
    networks:
     - nldmap-network

  neo4j-init:
    build:
      context: ./docker/neo4j
      dockerfile: Dockerfile
    env_file:
      - .env.neo4j
    entrypoint: ["/bin/bash", "-ec"]
    command: |
      export NEO4J_PASSWORD="$${NEO4J_AUTH#neo4j/}"
      [[ "$${NLDMAP_NEO4J_DEV_PASSWORD}" =~ ^[A-Za-z0-9]+$$ ]] || {
      echo "La contraseña demo de dev debe ser alfanumérica"
      exit 1
      }
      cypher-shell -a bolt://neo4j:7687 -u neo4j -d system \
      "CREATE USER dev IF NOT EXISTS SET PASSWORD '$${NLDMAP_NEO4J_DEV_PASSWORD}' CHANGE NOT REQUIRED;"
      cypher-shell -a bolt://neo4j:7687 -u neo4j -d system \
      "GRANT ROLE publisher TO dev;"
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - nldmap-network

volumes:
  nldmap_postgres_data:
  nldmap_mongo_data:
  nldmap_neo4j_data:

networks:
  nldmap-network:
    driver: bridge
