services:

  dev:
    build:
      context: .
      dockerfile: docker/dev/Dockerfile

    container_name: nldmap-dev

    working_dir: /workspace

    volumes:
      - .:/workspace

    ports:
      - "8080:8080"

    stdin_open: true
    tty: true

    command: sleep infinity

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - nldmap-network

  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    env_file:
      - .env.persistence
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nldmap_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nldmap-network

volumes:
  nldmap_postgres_data:

networks:
  nldmap-network:
    driver: bridge
