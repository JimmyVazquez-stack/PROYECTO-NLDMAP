services:

  dev:
    build:
      context: .
      dockerfile: docker/dev/Dockerfile

    container_name: nldmap-dev

    working_dir: /workspace

    volumes:
      - .:/workspace

    ports:
      - "8080:8080"

    depends_on:
      mongodb:
        condition: service_healthy

      postgres:
        condition: service_healthy

      neo4j:
        condition: service_healthy

    stdin_open: true
    tty: true

    command: sleep infinity

  # ========================================================
  # MongoDB
  # ========================================================

  mongodb:
    image: mongo:8
    container_name: nldmap-mongodb

    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-devadmin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-devpassword}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-nldmap}

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"db.adminCommand('ping').ok\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s   



  # ========================================================
  # PostgreSQL
  # ========================================================

  postgres:
    image: postgres:17
    container_name: nldmap-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-nldmap}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-devadmin} -d ${POSTGRES_DB:-nldmap}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  # ========================================================
  # Neo4j
  # ========================================================

  neo4j:
    image: neo4j:5
    container_name: nldmap-neo4j

    restart: unless-stopped

    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-devpassword}

    ports:
      - "7474:7474"
      - "7687:7687"

    volumes:
      - neo4j_data:/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-devpassword} 'RETURN 1;' || exit 1"
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s


# ==========================================================
# Persistent Volumes
# ==========================================================

volumes:

  mongodb_data:
    name: nldmap_mongodb_data

  postgres_data:
    name: nldmap_postgres_data

  neo4j_data:
    name: nldmap_neo4j_data